version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: data_circular_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env local}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env local}
    ports:
      # Solo accesible desde la máquina local; nunca exponer PostgreSQL a la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: data_circular_postgres_data
